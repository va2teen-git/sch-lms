<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уровень 1 - Глобальная сеть</title>
    <link rel="stylesheet" href="/static/bootstrap.min.css">
</head>
<body class="bg-dark text-success vh-100 overflow-hidden d-flex flex-column rounded-0" style="font-family: monospace;">
    <header class="p-3 border-bottom border-success d-flex justify-content-between align-items-center">
        <h5 class="m-0 text-success text-uppercase">Терминал: Уровень 1</h5>
        <h5 class="m-0 text-success">ФАЗА: <span id="phase-indicator">1 / 3</span></h5>
        <div class="text-success text-uppercase">Сбои: <span id="errors-indicator">0</span></div>
    </header>

    <main class="flex-grow-1 position-relative d-flex justify-content-center align-items-center p-4" id="game-area">
        <div class="container-fluid h-100 position-relative">
            <svg id="lines-svg" class="position-absolute top-0 start-0 w-100 h-100" style="pointer-events: none; z-index: 0;"></svg>

            <div class="row h-100 position-relative" style="z-index: 1;">
                <div class="col-5 d-flex flex-column justify-content-center h-100" id="left-col">
                </div>
                <div class="col-2"></div>
                <div class="col-5 d-flex flex-column justify-content-center h-100" id="right-col">
                </div>
            </div>
        </div>
    </main>
    
    <script>
        const DB = [
            { term: 'Фишинг', def: 'Выуживание конфиденциальных данных с помощью поддельных сайтов' },
            { term: 'Спам', def: 'Массовая рассылка нежелательных рекламных сообщений' },
            { term: 'Брандмауэр', def: 'Устройство или программа для защиты сети от несанкционированного доступа' },
            { term: 'Антивирус', def: 'Программа для обнаружения и безопасного удаления вредоносного ПО' },
            { term: 'HTTP', def: 'Базовый протокол передачи гипертекста (без встроенного шифрования)' },
            { term: 'HTTPS', def: 'Протокол передачи гипертекста, поддерживающий защищенное шифрование' },
            { term: 'IP-адрес', def: 'Уникальный сетевой адрес узла в компьютерной сети' },
            { term: 'Провайдер', def: 'Организация, предоставляющая доступ к услугам интернета' },
            { term: 'Браузер', def: 'Специальная программа для просмотра веб-страниц' },
            { term: 'URL', def: 'Единый указатель ресурса (стандартный адрес сайта в сети)' },
            { term: 'Троян', def: 'Вредоносная программа, маскирующаяся под легитимное и полезное ПО' },
            { term: 'DDoS-атака', def: 'Атака на систему с целью довести её до отказа путем перегрузки запросами' },
            { term: 'Доменное имя', def: 'Удобное символьное имя для идентификации узлов в интернете' },
            { term: 'Кибербуллинг', def: 'Систематическая травля и оскорбления пользователя в интернете' },
            { term: 'Цифровой след', def: 'Совокупность информации о пользователе, оставляемой им в сети' },
            { term: 'Куки (Cookies)', def: 'Фрагменты данных, отправленные веб-сервером и хранимые на устройстве пользователя' },
            { term: '2FA (Двухфакторная)', def: 'Метод защиты аккаунта двумя принципиально разными способами подтверждения' },
            { term: 'VPN', def: 'Технология для создания безопасного зашифрованного подключения к другой сети' },
            { term: 'Malware', def: 'Любое программное обеспечение, специально созданное для нанесения вреда' },
            { term: 'SSL/TLS', def: 'Криптографические протоколы для безопасной связи в интернете' }
        ];

        let currentPhase = 1;
        const totalPhases = 3;
        let errorsCount = 0;
        let startTime = Date.now();
        const pairsPerPhase = 4;

        let activeLeft = null;
        let activeRight = null;
        let matchedPairs = 0;
        let matchedNodes = [];

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function sendTelemetry(actionType, status, isSuccess = false) {
            const timeSpent = Math.floor((Date.now() - startTime) / 1000);
            window.parent.postMessage({
                type: 'TELEMETRY_EVENT',
                mission_name: 'Контрольная работа: Глобальная сеть :: Сопоставление (Ур 1)',
                action_type: actionType,
                status: status,
                start_time: new Date(startTime).toISOString(),
                time_spent_sec: timeSpent,
                attempts_count: errorsCount,
                success: isSuccess
            }, '*');
        }

        function generatePhase() {
            matchedPairs = 0;
            activeLeft = null;
            activeRight = null;
            matchedNodes = [];
            document.getElementById('lines-svg').innerHTML = '';
            
            let shuffledDB = shuffle([...DB]);
            let currentPairs = shuffledDB.slice(0, pairsPerPhase);
            
            let terms = shuffle(currentPairs.map(p => ({ id: p.term, text: p.term })));
            let defs = shuffle(currentPairs.map(p => ({ id: p.term, text: p.def })));
            
            renderColumn('left-col', terms, 'left');
            renderColumn('right-col', defs, 'right');
            
            document.getElementById('phase-indicator').innerText = `${currentPhase} / ${totalPhases}`;
        }

        function renderColumn(containerId, items, side) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            items.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'btn border border-success text-success bg-transparent rounded-0 text-start p-3 w-100 shadow-none my-2';
                btn.style.transition = "all 0.2s ease-in-out";
                btn.dataset.id = item.id;
                btn.dataset.side = side;
                btn.innerHTML = `<span style="pointer-events: none;">${item.text}</span>`;
                btn.onclick = () => handleSelect(btn);
                container.appendChild(btn);
            });
        }

        function handleSelect(btn) {
            if (btn.classList.contains('disabled')) return;
            
            const side = btn.dataset.side;
            if (side === 'left') {
                if (activeLeft) resetBtnState(activeLeft);
                activeLeft = btn;
                setActiveBtnState(activeLeft);
            } else {
                if (activeRight) resetBtnState(activeRight);
                activeRight = btn;
                setActiveBtnState(activeRight);
            }
            
            if (activeLeft && activeRight) {
                checkMatch();
            }
        }

        function resetBtnState(btn) {
            btn.className = 'btn border border-success text-success bg-transparent rounded-0 text-start p-3 w-100 shadow-none my-2';
        }

        function setActiveBtnState(btn) {
            btn.className = 'btn border border-success bg-success text-dark rounded-0 text-start p-3 w-100 shadow-none my-2';
        }

        function checkMatch() {
            const isMatch = activeLeft.dataset.id === activeRight.dataset.id;
            
            if (isMatch) {
                matchedNodes.push({l: activeLeft, r: activeRight});
                drawLine(activeLeft, activeRight, '#198754'); 
                
                setMatchedBtnState(activeLeft);
                setMatchedBtnState(activeRight);
                
                activeLeft = null;
                activeRight = null;
                matchedPairs++;
                
                if (matchedPairs === pairsPerPhase) {
                    setTimeout(() => {
                        currentPhase++;
                        if (currentPhase > totalPhases) {
                            document.getElementById('game-area').innerHTML = '<div class="text-center"><h2 class="text-success mb-4 text-uppercase">Доступ Разрешен</h2><p class="text-success">Анализ данных завершен. Все связи установлены верно.</p></div>';
                            sendTelemetry('level_complete', 'completed', true);
                        } else {
                            generatePhase();
                        }
                    }, 1000);
                }
            } else {
                errorsCount++;
                document.getElementById('errors-indicator').innerText = errorsCount;
                
                setErrorBtnState(activeLeft);
                setErrorBtnState(activeRight);
                
                drawLine(activeLeft, activeRight, '#dc3545'); 
                
                sendTelemetry('hardcore_reset', 'in_progress', false); 
                
                document.querySelectorAll('button').forEach(b => b.classList.add('disabled'));
                
                setTimeout(() => {
                    generatePhase();
                }, 1500);
            }
        }

        function setMatchedBtnState(btn) {
            btn.className = 'btn border border-secondary text-secondary bg-transparent rounded-0 text-start p-3 w-100 shadow-none my-2 disabled';
            btn.style.opacity = '0.5';
        }

        function setErrorBtnState(btn) {
            btn.className = 'btn border border-danger bg-danger text-light rounded-0 text-start p-3 w-100 shadow-none my-2 disabled';
        }

        function drawLine(elem1, elem2, color) {
            const svg = document.getElementById('lines-svg');
            const container = document.getElementById('game-area').getBoundingClientRect();
            const rect1 = elem1.getBoundingClientRect();
            const rect2 = elem2.getBoundingClientRect();
            
            const x1 = rect1.right - container.left;
            const y1 = rect1.top + rect1.height / 2 - container.top;
            
            const x2 = rect2.left - container.left;
            const y2 = rect2.top + rect2.height / 2 - container.top;
            
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
            line.setAttribute('stroke', color);
            line.setAttribute('stroke-width', '3');
            
            svg.appendChild(line);
        }

        window.addEventListener('resize', () => {
            const svg = document.getElementById('lines-svg');
            svg.innerHTML = '';
            matchedNodes.forEach(pair => {
                drawLine(pair.l, pair.r, '#198754');
            });
        });

        window.onload = () => {
            generatePhase();
            sendTelemetry('in_progress', 'in_progress', false);
        };
    </script>
</body>
</html>
