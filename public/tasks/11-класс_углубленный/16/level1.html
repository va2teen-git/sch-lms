<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уровень 1: Основы теории игр (Динамика)</title>
    <link href="/static/bootstrap.min.css" rel="stylesheet">
    <style>
        * { border-radius: 0 !important; }
        body { background: #0f0f13; color: #00ffcc; font-family: 'Courier New', Courier, monospace; padding: 20px; margin: 0; overflow-x: hidden; }
        h4, h5 { color: #fff; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 10px; }
        p { color: #a0a0b0; font-size: 1.1rem; }
        .terminal-box { border: 1px solid #00ffcc; background: #15151a; padding: 20px; margin-bottom: 20px; box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.1); }
        input[type="text"] { background: #000; border: 1px solid #555; color: #fff; padding: 5px 10px; font-family: 'Courier New', Courier, monospace; width: 150px; text-transform: lowercase; transition: all 0.3s; }
        input[type="text"]:focus { outline: none; border-color: #00ffcc; box-shadow: 0 0 8px rgba(0,255,204,0.5); }
        input.error-shake { border-color: #ff3366 !important; color: #ff3366; animation: shake 0.4s; }
        .btn-cyber { background: transparent; border: 1px solid #00ffcc; color: #00ffcc; padding: 10px 20px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
        .btn-cyber:hover { background: #00ffcc; color: #000; }
        .progress-container { margin-bottom: 20px; border: 1px solid #333; height: 10px; background: #000; }
        .progress-bar { height: 100%; background: #00ffcc; width: 0%; transition: width 0.3s; }
        .phase { display: none; animation: fadeIn 0.5s forwards; }
        .phase.active { display: block; }
        .game-row { display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center; border-bottom: 1px dashed #333; padding-bottom: 5px;}
        .game-name { font-weight: bold; color: #fff; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }
        .hardcore-flash { animation: flashRed 0.5s; }
        @keyframes flashRed { 0% { background: #ff0000; } 100% { background: #0f0f13; } }
    </style>
</head>
<body>

    <h4>Анализ: Основы теории игр</h4>
    <p>Прогресс сканирования: <span id="progress-text">0 / 3</span></p>
    <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>

    <div id="phases-container"></div>

    <script>
        const MISSION_NAME = 'Основы теории игр :: Уровень 1';
        let currentPhase = 1;
        let startTime = Date.now();
        let errorsCount = 0;

        // Data Banks
        const gamesBank = [
            { name: "Шахматы", val: "1" },
            { name: "Крестики-нолики", val: "1" },
            { name: "Игра в Го", val: "1" },
            { name: "Игра с кучами камней", val: "1" },
            { name: "Шашки", val: "1" },
            { name: "Покер", val: "0" },
            { name: "Камень-ножницы-бумага", val: "0" },
            { name: "Нарды (с кубиками)", val: "0" },
            { name: "Морской бой", val: "0" },
            { name: "Мафия", val: "0" }
        ];

        // Randomize elements
        function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }
        
        // Gen Phase 1
        const selectedGames = shuffle([...gamesBank]).slice(0, 4);

        // Gen Phase 2
        const winningMoveIndex = Math.floor(Math.random() * 3) + 1; // 1, 2, or 3
        
        // Gen Phase 3
        const isStartWinning = Math.random() > 0.5;
        const p3Answers = isStartWinning 
            ? ['выигрышной', 'есть', 'первый'] 
            : ['проигрышной', 'нет', 'второй'];

        document.getElementById('phases-container').innerHTML = `
            <!-- PHASE 1 -->
            <div id="phase-1" class="phase active terminal-box">
                <h5>Фаза 1: Классификация информационных потоков</h5>
                <p>Введите <b style="color:#00ffcc">1</b>, если это игра с ПОЛНОЙ информацией, и <b style="color:#00ffcc">0</b>, если присутствует случайность или скрытые данные.</p>
                ${selectedGames.map((g, i) => `
                    <div class="game-row">
                        <span class="game-name">${g.name}</span>
                        <input type="text" id="g${i}" maxlength="1" placeholder="_">
                    </div>
                `).join('')}
                <button class="btn-cyber mt-3" onclick="checkPhase1()">Верифицировать</button>
            </div>

            <!-- PHASE 2 -->
            <div id="phase-2" class="phase terminal-box">
                <h5>Фаза 2: Анализатор позиций</h5>
                <p>Из текущей позиции (Узел X) возможно сделать 3 хода.</p>
                <ul>
                    <li>Ход №1 ведет в <b>${winningMoveIndex === 1 ? 'П' : 'В'}-позицию</b> для соперника.</li>
                    <li>Ход №2 ведет в <b>${winningMoveIndex === 2 ? 'П' : 'В'}-позицию</b> для соперника.</li>
                    <li>Ход №3 ведет в <b>${winningMoveIndex === 3 ? 'П' : 'В'}-позицию</b> для соперника.</li>
                </ul>
                <div class="mb-3">
                    <label>Какой ход гарантирует победу? (1, 2 или 3)</label><br>
                    <input type="text" id="p2-q1" maxlength="1" placeholder="_">
                </div>
                <div class="mb-3">
                    <label>Текущая позиция (Узел X) Выигрышная или Проигрышная? (введите В или П)</label><br>
                    <input type="text" id="p2-q2" maxlength="1" placeholder="_">
                </div>
                <button class="btn-cyber mt-3" onclick="checkPhase2()">Отправить запрос</button>
            </div>

            <!-- PHASE 3 -->
            <div id="phase-3" class="phase terminal-box">
                <h5>Фаза 3: Постулат идеальной игры</h5>
                <p style="border-left: 3px solid #555; padding-left: 10px; font-style: italic;">
                    "Если игрок начинает партию, находясь в <input type="text" id="p3-q1" placeholder="..."> позиции, 
                    у него <input type="text" id="p3-q2" placeholder="..."> выигрышная стратегия. 
                    При идеальной игре победит <input type="text" id="p3-q3" placeholder="..."> игрок."
                </p>
                <p class="mt-2" style="font-size:0.9rem; color:#666;">(Слова: "выигрышной", "проигрышной", "есть", "нет", "первый", "второй")</p>
                <button class="btn-cyber mt-3" onclick="checkPhase3()">Завершить протокол</button>
            </div>

            <div id="phase-success" class="phase terminal-box" style="text-align: center; border-color: #00ffcc;">
                <h2 style="color: #00ffcc;">[ ДОСТУП РАЗРЕШЕН ]</h2>
                <p>Уровень 1 успешно пройден.</p>
            </div>
        `;

        function updateUI() {
            document.querySelectorAll('.phase').forEach(el => el.classList.remove('active'));
            if (currentPhase <= 3) {
                document.getElementById(`phase-${currentPhase}`).classList.add('active');
                document.getElementById('progress-text').innerText = `${currentPhase - 1} / 3`;
                document.getElementById('progress-bar').style.width = `${((currentPhase - 1) / 3) * 100}%`;
            } else {
                document.getElementById('phase-success').classList.add('active');
                document.getElementById('progress-text').innerText = `3 / 3`;
                document.getElementById('progress-bar').style.width = `100%`;
                
                window.parent.postMessage({
                    type: 'TELEMETRY_EVENT',
                    mission_name: MISSION_NAME,
                    action_type: 'level_complete',
                    start_time: new Date(startTime).toISOString(),
                    time_spent_sec: Math.floor((Date.now() - startTime) / 1000),
                    attempts_count: 1,
                    success: true,
                    action_log: [`Completed with ${errorsCount} errors`]
                }, '*');
            }
        }

        function triggerError(inputElements) {
            errorsCount++;
            document.body.classList.add('hardcore-flash');
            setTimeout(() => document.body.classList.remove('hardcore-flash'), 500);
            inputElements.forEach(el => {
                el.classList.add('error-shake');
                setTimeout(() => el.classList.remove('error-shake'), 500);
            });
            window.parent.postMessage({
                type: 'TELEMETRY_EVENT',
                mission_name: MISSION_NAME,
                action_type: 'hardcore_reset'
            }, '*');
        }

        window.checkPhase1 = function() {
            let valid = true;
            let inputs = [];
            selectedGames.forEach((g, i) => {
                const el = document.getElementById(`g${i}`);
                inputs.push(el);
                if (el.value.trim() !== g.val) valid = false;
            });
            if (valid) { currentPhase++; updateUI(); } else triggerError(inputs);
        }

        window.checkPhase2 = function() {
            const q1 = document.getElementById('p2-q1');
            const q2 = document.getElementById('p2-q2');
            if (q1.value.trim() === String(winningMoveIndex) && q2.value.trim().toLowerCase() === 'в') {
                currentPhase++; updateUI();
            } else triggerError([q1, q2]);
        }

        window.checkPhase3 = function() {
            const q1 = document.getElementById('p3-q1');
            const q2 = document.getElementById('p3-q2');
            const q3 = document.getElementById('p3-q3');
            if (q1.value.trim().toLowerCase() === p3Answers[0] && 
                q2.value.trim().toLowerCase() === p3Answers[1] && 
                q3.value.trim().toLowerCase() === p3Answers[2]) {
                currentPhase++; updateUI();
            } else triggerError([q1, q2, q3]);
        }
    </script>
</body>
</html>
