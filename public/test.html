<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/static/bootstrap.min.css">
    <script src="/static/vue.global.js"></script>
</head>
<body class="bg-black text-danger">
    <div id="app">
        <h1>{{ message }}</h1>
    </div>
    <script>
        const { createApp, ref } = Vue;
        createApp({
            setup() {
                const message = ref("HELLO VUE");
                return { message };
            }
        }).mount('#app');
    </script>
</body>
</html>
